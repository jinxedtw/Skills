<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__APP_NAME__ · 页面截图集</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#17253a;background:#f3f5f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{max-width:1480px;margin:auto;padding:52px 40px 26px}.eyebrow{color:#416483;font-size:12px;letter-spacing:.16em;font-weight:650}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.05em;margin:12px 0 14px;font-weight:650}header p{color:#607085;line-height:1.8;font-size:14px;margin:4px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.meta span{font-size:12px;background:white;border:1px solid #dce3eb;padding:8px 12px;border-radius:6px}nav{position:sticky;top:0;z-index:2;background:#f3f5f8f5;border-block:1px solid #dce3eb;padding:16px 40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;backdrop-filter:blur(14px)}.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}button,input{font:inherit}button{cursor:pointer}nav button{border:0;background:transparent;color:#576b83;padding:10px 13px;border-radius:6px;font-size:13px}nav button[aria-pressed=true]{background:#1a4ed8;color:white}input{border:1px solid #cbd5e1;background:white;padding:10px 12px;border-radius:6px;width:220px;font-size:13px}.count{font-size:12px;color:#64748b;min-width:68px}main{max-width:1480px;margin:auto;padding:28px 40px 56px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:32px 24px}.card{margin:0;min-width:0}.capture{border:1px solid #dde3ec;border-radius:12px;display:block;width:100%;overflow:hidden;background:#e7ecf3;padding:10px;transition:border-color .2s,transform .2s}.capture:hover{border-color:#7b9de8;transform:translateY(-3px)}.capture img{width:100%;height:auto;display:block;border-radius:5px;object-fit:contain;background:white}.caption{padding:13px 2px}.index{font-size:11px;color:#7a899a;font-variant-numeric:tabular-nums}.caption h2{font-size:15px;line-height:1.5;margin:5px 0;font-weight:600}.caption p{font-size:12px;color:#708093;line-height:1.65;margin:0}.group{font-size:11px;color:#416483}footer{border-top:1px solid #dce3eb;padding:24px 40px;color:#718096;font-size:12px;line-height:1.9}.empty{padding:60px;text-align:center;color:#64748b}dialog{border:0;background:#111a28;color:white;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;padding:0;margin:0}dialog::backdrop{background:#111a28}.viewer{height:100%;display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:16px}.bar p{font-size:13px;margin:0;color:#d1daea}.bar button,.arrows button{border:1px solid #516078;background:#1e2d44;color:white;border-radius:6px;padding:10px 16px}.stage{min-height:0;flex:1;display:flex;justify-content:center;padding:6px 24px}.stage img{max-height:100%;max-width:100%;object-fit:contain}.arrows{padding:14px 24px;display:flex;justify-content:center;align-items:center;gap:18px;font-size:12px;color:#a4b3c9}a{color:inherit}@media(max-width:600px){header{padding:30px 20px 24px}nav{padding:12px 16px;position:static}input{width:100%}main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.capture{padding:5px}.caption h2{font-size:13px}footer{padding:24px 20px}.bar{padding:12px}.bar p{max-width:65%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><div class="eyebrow">ANDROID / SCREEN CATALOG</div><h1>__APP_NAME__ 页面截图</h1><p>当前版本的真机页面与关键交互状态。点击截图查看原比例大图，使用方向键连续浏览。</p><div class="meta"><span>__DATE__</span><span>__DEVICE__</span><span id="total"></span><span>界面语言：__LANGUAGE__</span><span>离线单文件</span></div></header>
<nav aria-label="截图筛选"><div class="filters" id="filters"></div><input id="search" type="search" placeholder="搜索页面、格式、功能…" aria-label="搜索截图"><span class="count" id="count" aria-live="polite"></span></nav>
<main><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>没有匹配的页面</p></main>
<footer>范围与限制：__EXCLUSIONS__<br>PNG 原始截图和 manifest.json 位于 screenshots 文件夹；本 HTML 已内嵌图片，单独复制即可离线浏览。</footer>
<dialog id="lightbox" aria-label="截图大图"><div class="viewer"><div class="bar"><p id="viewTitle"></p><button id="close" aria-label="关闭大图">关闭 · Esc</button></div><div class="stage"><img id="large" alt=""></div><div class="arrows"><button id="previous" aria-label="上一张">← 上一张</button><span id="position"></span><button id="next" aria-label="下一张">下一张 →</button></div></div></dialog>
<script id="screens" type="application/json">__DATA_JSON__</script>
<script>
const screens=JSON.parse(document.querySelector('#screens').textContent);let category='全部',query='',shown=[],current=0,opener;
const $=s=>document.querySelector(s),cats=['全部',...new Set(screens.map(s=>s.category))];
$('#total').textContent=screens.length+' 张真实截图';
function filters(){const el=$('#filters');el.replaceChildren();cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;filters();render()};el.append(b)})}
function render(){shown=screens.filter(s=>(category==='全部'||s.category===category)&&(s.title+s.category+s.note+s.file).toLowerCase().includes(query.toLowerCase()));$('#count').textContent=shown.length+' / '+screens.length+' 张';$('#empty').hidden=shown.length>0;$('#grid').replaceChildren();shown.forEach((s,i)=>{const f=document.createElement('figure');f.className='card';const b=document.createElement('button');b.className='capture';b.setAttribute('aria-label','放大：'+s.title);const img=document.createElement('img');img.src=s.src;img.alt=s.title;img.loading='lazy';img.width=s.width;img.height=s.height;b.append(img);b.onclick=()=>{opener=b;current=i;view();$('#lightbox').showModal()};const cap=document.createElement('figcaption');cap.className='caption';const num=document.createElement('span');num.className='index';num.textContent=s.number+' / '+s.category;const h=document.createElement('h2');h.textContent=s.title;const p=document.createElement('p');p.textContent=s.note;cap.append(num,h,p);f.append(b,cap);$('#grid').append(f)})}
function view(){const s=shown[current];$('#large').src=s.src;$('#large').alt=s.title;$('#viewTitle').textContent=s.number+' · '+s.title;$('#position').textContent=(current+1)+' / '+shown.length;$('#previous').disabled=current===0;$('#next').disabled=current===shown.length-1}
function move(d){current=Math.max(0,Math.min(shown.length-1,current+d));view()}
$('#search').oninput=e=>{query=e.target.value;render()};$('#close').onclick=()=>$('#lightbox').close();$('#lightbox').onclose=()=>opener?.focus();$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(!$('#lightbox').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});filters();render();
</script></html>
